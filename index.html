<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitche Digital 360 | L'Élite de l'IA à Bouaké</title>
    
    <meta name="description" content="Expertise IA, Prompt Engineering et Software par Mitché Kouakou.">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --accent: #c8f06e; --bg: #050505; --text: #ffffff; --card: #111; --border: rgba(200, 240, 110, 0.2); --nav-bg: rgba(5, 5, 5, 0.9); }
        [data-theme="light"] { --bg: #f8f9fa; --text: #050505; --card: #ffffff; --border: rgba(0, 0, 0, 0.1); --nav-bg: rgba(248, 249, 250, 0.9); }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.6; overflow-x: hidden; scroll-behavior: smooth; }
        .container { width: 90%; max-width: 1200px; margin: auto; }

        /* NAVIGATION */
        nav { background: var(--nav-bg); backdrop-filter: blur(15px); padding: 15px 0; position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; color: var(--text); text-decoration: none; font-size: 1.1rem; }
        .theme-btn { background: var(--accent); border: none; width: 45px; height: 45px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(200, 240, 110, 0.1); }

        /* HEADER AVEC LA PHOTO INTÉGRÉE */
        header { padding: 160px 0 80px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        
        .profile-wrapper { position: relative; display: inline-block; }
        .profile-img { 
            width: 160px; height: 160px; border-radius: 40px; border: 2px solid var(--accent); 
            object-fit: cover; margin-bottom: 20px; transform: rotate(-3deg); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: rgba(17,17,17,0.5); /* Placeholder pendant le chargement */
            opacity: 0; /* Caché initialement */
            transition: opacity 0.5s ease-out; /* Apparition fluide */
        }
        .profile-img.loaded { opacity: 1; }

        h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 800; letter-spacing: -3px; line-height: 1; }
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin: 40px 0; }
        .card { background: var(--card); border-radius: 25px; border: 1px solid var(--border); padding: 40px; cursor: pointer; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; height: 320px; transition: 0.4s; }
        .card:hover { transform: translateY(-10px); border-color: var(--accent); box-shadow: 0 15px 30px rgba(200, 240, 110, 0.15); }
        .card h3 { font-size: 1.8rem; margin-bottom: 5px; z-index: 2; }
        .card .tag { color: var(--accent); font-weight: 800; font-size: 0.7rem; text-transform: uppercase; z-index: 2; margin-bottom: 10px; }

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(10px); z-index: 2000; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
        .modal.show { display: flex; opacity: 1; }
        .modal-content { background: var(--card); padding: 40px; border-radius: 30px; width: 90%; max-width: 500px; border: 1px solid var(--accent); text-align: center; transform: scale(0.9); transition: 0.3s; }
        .modal.show .modal-content { transform: scale(1); }
        .btn-wa { background: var(--accent); color: #000; padding: 18px; border: none; border-radius: 15px; font-weight: 800; width: 100%; display: inline-block; text-decoration: none; margin-top: 25px; }

        footer { padding: 60px 0; text-align: center; border-top: 1px solid var(--border); opacity: 0.6; font-size: 0.8rem; }
    </style>
</head>
<body>

    <nav>
        <div class="container nav-flex">
            <a href="#" class="logo">MITCHE DIGITAL <span style="color:var(--accent)">360</span></a>
            <button class="theme-btn" onclick="toggleTheme()">🌓</button>
        </div>
    </nav>

    <header>
        <div class="container">
            <div class="profile-wrapper">
                <img 
                    src="1773390803669.png" 
                    alt="Mitché Kouakou" 
                    class="profile-img" 
                    loading="lazy" 
                    onload="this.classList.add('loaded')">
            </div>
            <h1>Innovation <br><span style="color:var(--accent)">Elite.</span></h1>
            <p style="opacity: 0.6; max-width: 500px; margin: 20px auto;">Automatisez votre business avec l'élite technologique de Bouaké. IA & Software Engineering.</p>
        </div>
    </header>

    <main class="container">
        <section class="portfolio-grid">
            <div class="card" onclick="openModal('Prompt Engineering', 'Automatisez votre business avec des instructions IA de haute précision.', 'Bonjour Mitche Digital 360, je souhaite commander un pack de Prompt Engineering.')">
                <span class="tag">IA Avancée</span>
                <h3>Prompt Design</h3>
            </div>
            <div class="card" onclick="openModal('Smart Stock', 'Gestion d\'inventaire intelligente pour commerces et usines.', 'Bonjour Mitche Digital 360, je souhaite un devis pour votre logiciel Smart Stock.')">
                <span class="tag">Software</span>
                <h3>Gestion de Stock</h3>
            </div>
        </section>
    </main>

    <div id="myModal" class="modal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <h3 id="modalTitle" style="color:var(--accent); font-size: 2rem;">Détails</h3>
            <p id="modalDesc" style="margin: 20px 0; opacity: 0.8;"></p>
            <a id="waLink" href="#" class="btn-wa" rel="noopener noreferrer" target="_blank">Commander via WhatsApp</a>
            <button onclick="closeModal()" style="background:none; border:none; color:var(--text); margin-top:20px; cursor:pointer; opacity:0.5;">[ FERMER ]</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 MITCHE DIGITAL 360 - BOUAKÉ, CÔTE D'IVOIRE</p>
    </footer>

    <script>
        // GESTION DU THÈME
        const toggleTheme = () => {
            const doc = document.documentElement;
            const newTheme = doc.getAttribute("data-theme") === "light" ? "dark" : "light";
            doc.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);
        };
        document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "dark");

        // GESTION DE LA MODAL
        const openModal = (title, desc, message) => {
            const modal = document.getElementById('myModal');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            
            const encodedMessage = encodeURIComponent(message);
            document.getElementById('waLink').href = `https://wa.me/2250150882462?text=${encodedMessage}`;
            
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
            document.body.style.overflow = 'hidden';
        };

        const closeModal = () => {
            const modal = document.getElementById('myModal');
            modal.classList.remove('show');
            setTimeout(() => { modal.style.display = 'none'; document.body.style.overflow = 'auto'; }, 300);
        };

        // FERMETURE AU CLIC EXTÉRIEUR
        window.onclick = (e) => { if(e.target.id === 'myModal') closeModal(); };
    </script>
</body>
</html>
