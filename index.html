<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitché Kouakou | Digital Entrepreneur</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --accent: #c8f06e; /* Vert lime professionnel */
            --text: #ffffff;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            line-height: 1.6;
        }
        .container { width: 90%; max-width: 1000px; margin: auto; padding: 20px; }
        header { text-align: center; padding: 50px 0; }
        .profile-img {
            width: 150px; height: 150px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            object-fit: cover;
        }
        h1 { font-size: 2.5rem; margin: 10px 0; }
        .highlight { color: var(--accent); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .card {
            background: #161616;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
        }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-content { padding: 20px; }
        .btn-whatsapp {
            display: inline-block;
            background: var(--accent);
            color: #000;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 30px;
            transition: transform 0.3s;
        }
        .btn-whatsapp:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="https://raw.githubusercontent.com/yveskouakou080-glitch/yveskouakou080.github.io/main/1000205794.png" class="profile-img" alt="Mitché Kouakou">
            <h1>Mitché <span class="highlight">Kouakou</span></h1>
            <p>Digital Entrepreneur | Prompteur IA | Graphic Designer</p>
            <a href="https://wa.me/225XXXXXXXX" class="btn-whatsapp">Me contacter sur WhatsApp</a>
        </header>

        <section id="projets">
            <h2 class="highlight">Mes Réalisations</h2>
            <div class="grid">
                <div class="card">
                    <img src="https://raw.githubusercontent.com/yveskouakou080-glitch/yveskouakou080.github.io/main/1000195544.png" alt="IA Concept">
                    <div class="card-content">
                        <h3>Génération IA Premium</h3>
                        <p>Création de visuels futuristes et haute définition pour entreprises.</p>
                    </div>
                </div>
                <div class="card">
                    <img src="https://raw.githubusercontent.com/yveskouakou080-glitch/yveskouakou080.github.io/main/1000197691.png" alt="Formation">
                    <div class="card-content">
                        <h3>Stratégie Web</h3>
                        <p>Accompagnement dans la création rapide de sites et présence digitale.</p>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
