<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitche Digital 360 | Excellence IA & Software</title>
    
    <meta name="description" content="Expertise en Prompt Engineering et solutions logicielles à Bouaké.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { 
            --accent: #c8f06e; 
            --bg: #050505; 
            --text: #ffffff;
            --card: #111; 
            --border: rgba(200, 240, 110, 0.15);
            --nav-bg: rgba(5, 5, 5, 0.85);
            --hover-scale: 1.03;
        }

        [data-theme="light"] {
            --bg: #f4f7f6;
            --text: #050505;
            --card: #ffffff;
            --border: rgba(0, 0, 0, 0.1);
            --nav-bg: rgba(244, 247, 246, 0.85);
        }

        /* Base & Typo */
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.6; overflow-x: hidden; scroll-behavior: smooth; }
        .container { width: 90%; max-width: 1100px; margin: auto; }

        /* Navigation */
        nav { background: var(--nav-bg); backdrop-filter: blur(12px); padding: 18px 0; position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; color: var(--text); text-decoration: none; font-size: 1.2rem; letter-spacing: -0.5px; }
        
        .theme-btn { background: var(--accent); border: none; width: 42px; height: 42px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .theme-btn:focus-visible, .btn-wa:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

        /* Header Sémantique */
        header { padding: 180px 0 100px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .profile-img { width: 150px; height: 150px; border-radius: 35px; border: 2px solid var(--accent); object-fit: cover; margin-bottom: 24px; transform: rotate(-2deg); transition: transform 0.4s ease; }
        .profile-img:hover { transform: rotate(0deg) scale(1.05); }
        h1 { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; letter-spacing: -2px; margin-bottom: 10px; }

        /* Portfolio Grid */
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin: 50px 0; }
        .card { 
            background: var(--card); border-radius: 28px; border: 1px solid var(--border); padding: 45px; 
            cursor: pointer; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .card:hover { transform: translateY(-10px) scale(var(--hover-scale)); border-color: var(--accent); box-shadow: 0 20px 40px rgba(200, 240, 110, 0.1); }
        .card h3 { font-size: 1.5rem; margin-top: 10px; }

        /* Modal Elite */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.94); backdrop-filter: blur(8px); z-index: 2000; 
            align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;
        }
        .modal.show { display: flex; opacity: 1; }
        .modal-content { 
            background: var(--card); padding: 50px; border-radius: 40px; width: 92%; max-width: 500px; 
            border: 1px solid var(--accent); text-align: center; 
            transform: translateY(30px); transition: transform 0.4s ease;
        }
        .modal.show .modal-content { transform: translateY(0); }
        
        .btn-wa { background: var(--accent); color: #000; padding: 20px; border: none; border-radius: 18px; font-weight: 800; width: 100%; display: inline-block; text-decoration: none; margin-top: 30px; transition: transform 0.2s; }
        .btn-wa:hover { filter: brightness(0.9); transform: scale(1.02); }

        footer { padding: 50px 0; text-align: center; border-top: 1px solid var(--border); opacity: 0.5; font-size: 0.85rem; }

        @media (max-width: 768px) { .portfolio-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav>
        <div class="container nav-flex">
            <a href="#" class="logo">MITCHE DIGITAL <span style="color:var(--accent)">360</span></a>
            <button class="theme-btn" onclick="toggleTheme()" aria-label="Changer le thème">🌓</button>
        </div>
    </nav>

    <main class="container">
        <header>
            <img src="image_1.png" alt="Mitché Kouakou" class="profile-img" loading="lazy">
            <h1>Future <span style="color:var(--accent)">Driven.</span></h1>
            <p style="opacity: 0.7; max-width: 600px;">L'agence digitale nouvelle génération à Bouaké. Spécialiste en IA et solutions logicielles sur-mesure.</p>
        </header>

        <section class="portfolio-grid">
            <div class="card" tabindex="0" role="button" onclick="openModal('Prompt Engineering', 'Optimisez vos revenus grâce à des architectures de prompts de précision.', 'Bonjour Mitche Digital 360, je souhaite commander un pack de Prompt Engineering.')">
                <span style="color:var(--accent); font-weight:800; font-size:0.75rem; text-transform:uppercase; letter-spacing: 1px;">Expertise IA</span>
                <h3>Prompt Design</h3>
            </div>
            
            <div class="card" tabindex="0" role="button" onclick="openModal('Smart Stock', 'Logiciel de gestion de flux pour commerces et PME.', 'Bonjour Mitche Digital 360, je souhaite un devis pour votre logiciel Smart Stock.')">
                <span style="color:var(--accent); font-weight:800; font-size:0.75rem; text-transform:uppercase; letter-spacing: 1px;">Software</span>
                <h3>Smart Stock</h3>
            </div>
        </section>
    </main>

    <div id="myModal" class="modal" aria-hidden="true" role="dialog">
        <div class="modal-content">
            <h3 id="modalTitle" style="color:var(--accent); font-size: 1.8rem;">Détails</h3>
            <p id="modalDesc" style="margin: 25px 0; opacity: 0.8; font-size: 1.1rem;"></p>
            <a id="waLink" href="#" class="btn-wa" rel="noopener noreferrer" target="_blank">Démarrer sur WhatsApp</a>
            <button onclick="closeModal()" aria-label="Fermer" style="background:none; border:none; color:var(--text); margin-top:25px; cursor:pointer; opacity:0.4; font-weight:800;">[ FERMER ]</button>
        </div>
    </div>

    <footer>&copy; 2026 MITCHE DIGITAL 360 &bull; BOUAKÉ, CÔTE D'IVOIRE</footer>

    <script>
        // Gestion Thème
        const toggleTheme = () => {
            const doc = document.documentElement;
            const newTheme = doc.getAttribute("data-theme") === "light" ? "dark" : "light";
            doc.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);
        };
        document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "dark");

        // Logic Modal
        const openModal = (title, desc, message) => {
            const modal = document.getElementById('myModal');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            
            const encodedMessage = encodeURIComponent(message);
            document.getElementById('waLink').href = `https://wa.me/2250150882462?text=${encodedMessage}`;
            
            modal.style.display = 'flex';
            modal.setAttribute('aria-hidden', 'false');
            setTimeout(() => {
                modal.classList.add('show');
                document.querySelector('.btn-wa').focus(); 
            }, 10);
            document.body.style.overflow = 'hidden';
        };

        const closeModal = () => {
            const modal = document.getElementById('myModal');
            modal.classList.remove('show');
            modal.setAttribute('aria-hidden', 'true');
            setTimeout(() => {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }, 350);
        };

        // Accessibilité Clavier
        window.addEventListener('click', (e) => { if (e.target.id === 'myModal') closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
        
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('keydown', (e) => { if (e.key === 'Enter') card.click(); });
        });

    </script>
    
    <script async src="https://embed.tawk.to/69c56f360296281c355a806d/default" charset="UTF-8" crossorigin="*"></script>
</body>
</html>
